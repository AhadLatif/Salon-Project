# infrastructure/docker/compose.yml
services:
  postgres:
    # 1. THE IMAGE: PostgreSQL 18 + PostGIS 3.6, pinned tag (ADR-017 §5.1).
    #    - Ships server 18.6 >= our existing data dir's 18.4 (safe direction: a newer
    #      minor upgrades an older data dir in place; the reverse is refused).
    #    - The PG18+ data-dir layout (/var/lib/postgresql) matches our volume mount below.
    #    - Swapping the image only makes PostGIS AVAILABLE; the extension is turned on
    #      per database by migration 0014 (never by hand).
    #    - Rollback after that migration is NOT a revert here — restore from
    #      .local-backups/ (see docs .../marketplace/POSTGIS_SETUP_PLAN.md §8).
    image: postgis/postgis:18-3.6-alpine
    container_name: salon_postgres
    restart: unless-stopped
    
    # 2. THE SECRETS: We tell Postgres what credentials to use when it wakes up.
    # It reads these from your root .env file.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      
    # 3. THE DOORS: We map port 5432 inside the container to port 5432 on your laptop,
    # so your API and Drizzle can "talk" to it.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
      
    # 4. THE SAFE: Docker containers wipe their memory when destroyed. 
    # A "volume" saves your data permanently to your actual hard drive so you don't lose users when you restart.
    volumes:
      - salon_pg_data:/var/lib/postgresql/

volumes:
  salon_pg_data: